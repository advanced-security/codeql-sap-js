extensions:
  - addsTo:
      pack: codeql/javascript-all
      extensible: typeModel
    data:
      - ["CapCqlSelect", "global", "Member[SELECT]"]
      - ["CapCqlSelect", "@sap/cds", "Member[ql].Member[SELECT]"]
      - ["CapCqlSelect", "CapCqlSelect", "Member[one,distinct]"]
      - ["CapCqlSelect", "CapCqlSelect", "ReturnValue"]
      - ["CapCqlSelectQuery", "CapCqlSelect", "Member[from].ReturnValue"]
      - ["CapCqlSelectQuery", "CapCqlSelectQuery", "Member[alias,columns,forShareLock,forUpdate,groupBy,having,hints,limit,orderBy,where].ReturnValue"]
      - ["CapCqlInto", "global", "Member[INSERT,UPSERT]"]
      - ["CapCqlInto", "@sap/cds", "Member[ql].Member[INSERT,UPSERT]"]
      - ["CapCqlInto", "CapCqlInto", "ReturnValue"]
      - ["CapCqlIntoQuery", "CapCqlInto", "Member[into].ReturnValue"]
      - ["CapCqlIntoQuery", "CapCqlIntoQuery", "Member[as,columns,entries,from,rows,values].ReturnValue"]
      - ["CapCqlUpdate", "global", "Member[UPDATE]"]
      - ["CapCqlUpdate", "@sap/cds", "Member[ql].Member[UPDATE]"]
      - ["CapCqlUpdateQuery", "CapCqlUpdate", "ReturnValue"]
      - ["CapCqlUpdateQuery", "CapCqlUpdate", "Member[entity].ReturnValue"]
      - ["CapCqlUpdateQuery", "CapCqlUpdateQuery", "Member[set,where,with].ReturnValue"]
      - ["CapCqlDelete", "global", "Member[DELETE]"]
      - ["CapCqlDelete", "@sap/cds", "Member[ql].Member[DELETE]"]
      - ["CapCqlDeleteQuery", "CapCqlDelete", "Member[from].ReturnValue"]
      - ["CapCqlDeleteQuery", "CapCqlDeleteQuery", "Member[where].ReturnValue"]

  - addsTo:
      pack: codeql/javascript-all
      extensible: sinkModel
    data:
      - ["CapCqlSelect", "Argument[0..]", "cap-cql-structure"]
      - ["CapCqlSelect", "Member[from].Argument[0,2]", "cap-cql-structure"]
      - ["CapCqlSelectQuery", "Member[columns,groupBy,orderBy].Argument[0..]", "cap-cql-structure"]
      - ["CapCqlSelectQuery", "Member[having,where].Argument[0]", "cap-cql-structure"]
      - ["CapCqlSelectQuery", "Member[alias].Argument[0]", "cap-cql-structure"]
      - ["CapCqlSelectQuery", "Member[hints].Argument[0..]", "cap-cql-structure"]
      - ["CapCqlInto", "Member[into].Argument[0]", "cap-cql-structure"]
      - ["CapCqlIntoQuery", "Member[columns].Argument[0..]", "cap-cql-structure"]
      - ["CapCqlUpdate", "Argument[0]", "cap-cql-structure"]
      - ["CapCqlUpdate", "Member[entity].Argument[0]", "cap-cql-structure"]
      - ["CapCqlUpdateQuery", "Member[set,where,with].Argument[0]", "cap-cql-structure"]
      - ["CapCqlDelete", "Member[from].Argument[0]", "cap-cql-structure"]
      - ["CapCqlDeleteQuery", "Member[where].Argument[0]", "cap-cql-structure"]
